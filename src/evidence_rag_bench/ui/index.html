<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evidence RAG Bench｜证据检索评测台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">固定语料 · 本地检索</p>
      <h1>Evidence RAG Bench</h1>
      <p class="lede">在固定语料里找答案；证据不够时，系统会直接说明。</p>
      <p>语料是英文技术文档。拿一个英文问题试试，页面会把命中的段落和引用一起列出来。</p>
      <form id="ask-form" aria-label="证据检索">
        <label for="question">英文问题</label>
        <textarea id="question" required maxlength="1000" placeholder="How does lexical retrieval work?"></textarea>
        <button type="submit">查看相关段落</button>
      </form>
      <section id="result" aria-label="检索结果" aria-live="polite" hidden>
        <p id="status" class="status"></p>
        <p id="answer"></p>
        <p id="reason"></p>
        <p id="latency"></p>
        <div id="evidence"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
