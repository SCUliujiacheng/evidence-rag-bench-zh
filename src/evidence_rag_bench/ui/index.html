<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evidence RAG Bench｜证据检索评测台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">固定语料 · 本地检索</p>
      <h1>Evidence RAG Bench</h1>
      <p class="lede">在固定语料里找证据；证据不够时，系统会直接说明。</p>
      <p>默认语料是三份中文开源文档。也可以切回英文基准，两个版本各用各的开发集阈值。</p>
      <form id="ask-form" aria-label="证据检索">
        <label for="profile">语料版本</label>
        <select id="profile" name="profile">
          <option value="zh-v1" selected>中文语料（zh-v1）</option>
          <option value="en-v1">英文语料（en-v1）</option>
        </select>
        <label for="question">问题</label>
        <textarea id="question" required maxlength="1000" placeholder="Milvus 为什么同时支持流处理和批处理？"></textarea>
        <button type="submit">查看相关段落</button>
      </form>
      <section id="result" aria-label="检索结果" aria-live="polite" hidden>
        <p id="status" class="status"></p>
        <p id="answer"></p>
        <p id="reason"></p>
        <p id="latency"></p>
        <div id="evidence"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
