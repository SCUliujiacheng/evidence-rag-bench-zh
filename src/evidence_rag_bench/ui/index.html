<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>检索实验 · Evidence RAG Bench</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/">Evidence RAG Bench</a>
      <nav aria-label="项目链接">
        <a href="https://github.com/SCUliujiacheng/evidence-rag-bench-zh#readme" target="_blank" rel="noreferrer">使用说明</a>
        <a href="https://github.com/SCUliujiacheng/evidence-rag-bench-zh" target="_blank" rel="noreferrer">GitHub</a>
      </nav>
    </header>
    <main>
      <div class="page-heading">
        <h1>检索实验</h1>
        <p>输入一个问题，对照返回的段落检查出处。</p>
      </div>
      <div class="workspace">
        <aside class="query-panel" aria-labelledby="query-title">
          <h2 id="query-title">问题</h2>
          <form id="ask-form" aria-label="证据检索">
            <label for="profile">语料</label>
            <select id="profile" name="profile">
              <option value="zh-v1" selected>中文 · zh-v1</option>
              <option value="en-v1">英文 · en-v1</option>
            </select>
            <label for="question">请输入问题</label>
            <textarea id="question" name="question" required maxlength="1000" rows="4" placeholder="Milvus 为什么同时支持流处理和批处理？"></textarea>
            <button class="submit-button" type="submit">检索</button>
          </form>
          <section class="examples" aria-labelledby="examples-title">
            <h3 id="examples-title">示例问题</h3>
            <div id="examples"></div>
          </section>
          <section class="corpus-summary" aria-labelledby="corpus-title">
            <h3 id="corpus-title">当前语料</h3>
            <dl id="corpus-list"></dl>
            <p id="corpus-note"></p>
          </section>
        </aside>
        <section id="result" class="result-panel" aria-labelledby="results-title" aria-busy="false">
          <header class="result-heading">
            <h2 id="results-title">检索结果</h2>
            <p id="result-meta"></p>
          </header>
          <div id="empty-state" class="empty-state">
            <p>还没有检索结果。</p>
            <p>写下问题，或选一个示例试试。</p>
          </div>
          <div id="response" hidden>
            <p id="submitted-question" class="submitted-question" hidden></p>
            <p id="status" class="status" role="status" aria-live="polite"></p>
            <p id="reason" class="reason" hidden></p>
            <p id="latency" class="latency" hidden></p>
            <div id="evidence" class="evidence-list"></div>
          </div>
          <p class="result-note">相关性分数不能判断一段材料是否足以回答问题。</p>
        </section>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
