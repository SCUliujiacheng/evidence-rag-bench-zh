[project]
name = "evidence-rag-bench"
version = "0.1.0"
description = "可复现的证据约束 Retrieval-Augmented Generation（RAG）评测基准。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]
